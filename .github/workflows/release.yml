name: Release

# Push a tag such as v0.2.0 (matching package.json) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Typecheck, lint and unit tests
        run: pnpm check

      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Package for Chrome and Firefox
        run: pnpm zip && pnpm zip:firefox

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .output/*-chrome.zip .output/*-firefox.zip \
            --title "Control Feed $GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
