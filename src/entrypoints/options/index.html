<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <!-- On iOS the settings live in the app. -->
    <meta name="manifest.exclude" content="['safari']" />
    <title>No Brainrot settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img class="brand-mark" src="/icon/128.png" alt="" width="40" height="40" />
        <div>
          <h1>No Brainrot</h1>
          <p class="tagline">Take back your attention. Changes apply to open tabs right away.</p>
        </div>
      </header>
      <main id="options" aria-busy="true">
        <p class="loading">Loading your settings…</p>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
