<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">No Brainrot</title>
  <defs>
    <!-- User space, so the slash's cut-out matches the tile behind it exactly. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#7b44ff"/>
      <stop offset="1" stop-color="#3d1bb8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- A melting brain: overlapping lobes and two drips, outlined by a larger copy behind. -->
  <g transform="translate(64 62) scale(1.15) translate(-64.5 -58.5)">
    <g fill="#c2306f" stroke="#c2306f" stroke-width="6" stroke-linejoin="round">
      <path d="M49 74c1.5 6 2.5 9 2.5 15a3.5 3.5 0 0 0 7 0c0-5 1-8 2.5-13z"/>
      <path d="M67 78c1 3 1.5 5 1.5 8a3 3 0 0 0 6 0c0-3 .5-5 1.5-8z"/>
    </g>
    <g fill="#c2306f">
      <circle cx="47" cy="60" r="16"/>
      <circle cx="56" cy="49" r="16"/>
      <circle cx="72" cy="48" r="17"/>
      <circle cx="83" cy="60" r="15"/>
      <circle cx="64" cy="70" r="16"/>
      <circle cx="48" cy="70" r="13"/>
      <circle cx="80" cy="74" r="11"/>
    </g>
    <g fill="#ffa3c7">
      <circle cx="47" cy="60" r="13"/>
      <circle cx="56" cy="49" r="13"/>
      <circle cx="72" cy="48" r="14"/>
      <circle cx="83" cy="60" r="12"/>
      <circle cx="64" cy="70" r="13"/>
      <circle cx="48" cy="70" r="10"/>
      <circle cx="80" cy="74" r="8"/>
      <path d="M49 74c1.5 6 2.5 9 2.5 15a3.5 3.5 0 0 0 7 0c0-5 1-8 2.5-13z"/>
      <path d="M67 78c1 3 1.5 5 1.5 8a3 3 0 0 0 6 0c0-3 .5-5 1.5-8z"/>
    </g>
    <g fill="none" stroke="#c2306f" stroke-width="3.5" stroke-linecap="round">
      <path d="M42 60q6-5 11 1"/>
      <path d="M58 42q5 6-1 12"/>
      <path d="M69 39q-2 8 6 11"/>
      <path d="M86 55q-7 2-5 10"/>
      <path d="M55 72q6-6 13-1"/>
      <path d="M74 72q5 3 11 0"/>
    </g>
  </g>
  <!-- The "no" sign, with a gap cut around the slash so it reads over the brain. -->
  <line x1="33" y1="33" x2="95" y2="95" stroke="url(#tile)" stroke-width="17"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#ffffff" stroke-width="9"/>
  <line x1="33" y1="33" x2="95" y2="95" stroke="#ffffff" stroke-width="9"/>
</svg>
