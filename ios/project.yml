# The Xcode project is generated from this file and is not committed:
#   pnpm build:safari
#   cd ios && xcodegen generate
name: NoBrainrot

options:
  bundleIdPrefix: io.github.lpedenon
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "17.0"

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SDKROOT: iphoneos
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    # The build script that embeds the web extension reads outside the project.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  NoBrainrotKit:
    path: Packages/NoBrainrotKit

targets:
  NoBrainrot:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: NoBrainrotExtension
      - package: NoBrainrotKit
        product: NoBrainrotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NB_BUNDLE_ID)
        PRODUCT_NAME: NoBrainrot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: No Brainrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the app ask whether the YouTube app is installed, and nothing else.
        LSApplicationQueriesSchemes:
          - youtube
        CFBundleURLTypes:
          - CFBundleURLName: $(NB_BUNDLE_ID)
            CFBundleURLSchemes:
              - nobrainrot
        NBAppGroupIdentifier: $(NB_APP_GROUP)
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups:
          - $(NB_APP_GROUP)

  NoBrainrotExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
    dependencies:
      - package: NoBrainrotKit
        product: NoBrainrotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NB_EXTENSION_BUNDLE_ID)
        PRODUCT_NAME: NoBrainrotExtension
        SKIP_INSTALL: YES
    info:
      path: Generated/Extension-Info.plist
      properties:
        CFBundleDisplayName: No Brainrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
        NBAppGroupIdentifier: $(NB_APP_GROUP)
    entitlements:
      path: Generated/Extension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(NB_APP_GROUP)
    postCompileScripts:
      - path: Scripts/embed-web-extension.sh
        name: Embed the web extension
        basedOnDependencyAnalysis: false
